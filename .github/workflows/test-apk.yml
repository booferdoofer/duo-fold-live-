name: Test APK (unofficial)

on:
  push:
    branches: [test-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: |
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew
      - name: Unit tests
        run: ./gradlew --no-daemon testGithubDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleGithubDebug
      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short="${GITHUB_SHA::7}"
          apk=$(ls app/build/outputs/apk/github/debug/*.apk | head -1)
          cp "$apk" "Duo-Fold-Live-fix-test-$short.apk"
          gh release create "test-$short" "Duo-Fold-Live-fix-test-$short.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Test build: fade + unlock flash fix ($short)" \
            --notes "Unofficial debug build of the fix/fade-and-unlock-flash branch. Debug-signed: uninstall the official Duo Fold Live first (its settings will reset), then install this APK. Reinstall the official release to go back."
