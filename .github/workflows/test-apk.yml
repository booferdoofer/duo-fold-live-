name: Test APK (unofficial)

on:
  push:
    branches: [test-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Build and test
        id: build
        run: |
          set -o pipefail
          {
            echo "== SDK"; which sdkmanager || ls "$ANDROID_HOME" || true
            yes | sdkmanager --licenses > /dev/null || true
            sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'
            printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
            chmod +x gradlew
            echo "== Build"
            ./gradlew --no-daemon assembleGithubDebug
            echo "== Tests"
            ./gradlew --no-daemon testGithubDebugUnitTest
          } 2>&1 | tee build.log
      - name: Publish APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short="${GITHUB_SHA::7}"
          apk=$(ls app/build/outputs/apk/github/debug/*.apk | head -1)
          cp "$apk" "Duo-Fold-Live-fix-test-$short.apk"
          gh release create "test-$short" "Duo-Fold-Live-fix-test-$short.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Test build: fade + unlock flash fix ($short)" \
            --notes "Unofficial debug build of the fix/fade-and-unlock-flash branch. Debug-signed: uninstall the official Duo Fold Live first (its settings will reset), then install this APK. Reinstall the official release to go back."
      - name: Publish log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short="${GITHUB_SHA::7}"
          touch build.log
          { grep -nE "^e: |error:|FAILED|What went wrong|Exception" -A4 build.log | head -300; echo "== TAIL"; tail -200 build.log; } > errors.txt || true
          gh release create "log-$short-$GITHUB_RUN_ATTEMPT" errors.txt build.log --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Build log $short (${{ steps.build.outcome }})" --notes "Build log for debugging."
